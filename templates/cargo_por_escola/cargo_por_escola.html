<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
</head>

<body>
  <style>
    body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .cpe_page {
      font-family: Arial, sans-serif;
      font-size: 8pt;
      position: relative;
      page-break-after: always;
      margin: 5mm;
    }

    /* Estilos da distribuição */
    .cpe_organizacao {
      text-align: center;
      font-size: 10pt;
      margin-bottom: 10px;
    }

    .cpe_school-container {
      margin-bottom: 15px;
      page-break-inside: avoid;
    }

    .cpe_school-header {
      background-color: #ddd;
      padding: 5px;
      font-weight: bold;
      font-size: 10pt;
      margin-top: 10px;
      margin-bottom: 5px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      column-gap: 10px;
      align-items: center;
    }

    .cpe_school-name {
      width: 60%;
    }

    /* .school-total {
     justify-self: center;
    } */

    .cpe_school-hour {
      text-align: right;
      min-width: 100px;
      justify-self: end;
    }

    .cpe_position-row {
      display: flex;
      margin-bottom: 3px;
      font-size: 10pt;
    }

    .cpe_position-quantity {
      width: 40px;
      text-align: center;
      padding-right: 5px;
    }

    .cpe_position-description {
      flex-grow: 1;
    }

    .cpe_footer {
      position: fixed;
      bottom: 15mm;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 8pt;
    }
  </style>

  <div class="cpe_page">
    {{ header }}

    {% for escola in escolas %}
    <div class="cpe_school-container">
      <div class="cpe_school-header">
        <div class="cpe_school-name">{{ escola.nome }}</div>
        <div class="cpe_school-total">(TOTAL: {{ escola.qtd_candidatos }})</div>
        <div class="cpe_school-hour">{{ escola.dia }} {{ escola.turno }} {{ escola.horario }}</div>
      </div>

      {% for cargo in escola.cargos %}
      <div class="cpe_position-row">
        <div class="cpe_position-quantity">{{ cargo.qtd }}</div>
        <div class="cpe_position-description">{{ cargo.nome }}</div>
      </div>
      {% endfor %}
    </div>
    {% endfor %}
  </div>
</body>

</html>
